name: Quality and performance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PERF_BASE_URL: http://127.0.0.1:3103

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:performance-budget
      - name: Start production server
        run: npm run start -- --port 3103 > /tmp/parkchargeev-next.log 2>&1 &
      - run: npm run verify:performance-routes
